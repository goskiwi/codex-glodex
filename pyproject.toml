[project]
name = "glodex"
version = "0.1.0"
description = "Evidence-grounded global commerce search"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.135,<1",
    "pydantic>=2.12,<3",
]

[project.scripts]
glodex = "glodex.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glodex"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.18,<2",
    "pytest>=9,<10",
    "pytest-socket>=0.7,<1",
    "ruff>=0.14,<1",
    "uvicorn>=0.35,<1",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--disable-socket",
    "--allow-unix-socket",
]
markers = [
    "unit: isolated unit test",
    "contract: public or port contract test",
    "acceptance: black-box specification acceptance test",
    "architecture: dependency and offline boundary test",
    "nfr: non-functional requirement test",
    "performance: reference performance workload",
    "spec(*ids): specification IDs covered by the test",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src"]
files = ["src/glodex", "scripts"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
