services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: glodex
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: glodex
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - m2b-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:6380:6379"

volumes:
  m2b-postgres-data:
